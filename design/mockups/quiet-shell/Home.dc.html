<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home as the hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#090b10}
button{font:inherit;cursor:pointer}
a{color:#f0a443}a:hover{color:#f6e7c8}
</style>
</helmet>
<div style="width: 100%; height: 800px; display: flex; flex-wrap: wrap; background: #090b10; color: #c9cfdd; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; overflow: hidden">
  <nav aria-label="Tasks" style="flex: 1 0 220px; max-width: 240px; height: 800px; box-sizing: border-box; background: #0c0e14; border-right: 1px solid #1d2230; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px">
    <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; margin-bottom: 10px; background: #090b10; border: 1px solid #1d2230; border-radius: 6px; color: #8b93a7; text-align: left">
      <svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
      <span style="flex-grow: 1">Go to or run</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">Ctrl Shift P</span>
    </button>
    <button aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; background: #151a26; border: 0; border-radius: 6px; color: #f6e7c8; text-align: left">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 7.5 8 3l5.5 4.5V13h-4V9.5h-3V13h-4z"></path></svg>
      <span>Home</span>
    </button>
    <div style="margin: 14px 8px 6px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8b93a7">Tasks</div>
    <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; background: transparent; border: 0; border-radius: 6px; color: #c9cfdd; text-align: left">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b93a7">412</span>
      <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Fix login redirect</span>
    </button>
    <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; background: transparent; border: 0; border-radius: 6px; color: #c9cfdd; text-align: left">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b93a7">398</span>
      <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Export invoices as CSV</span>
      <span role="img" aria-label="Waits on you" style="width: 6px; height: 6px; border-radius: 50%; background: #f0a443"></span>
    </button>
    <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; background: transparent; border: 0; border-radius: 6px; color: #c9cfdd; text-align: left">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b93a7">377</span>
      <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rate table per customer</span>
    </button>
    <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; background: transparent; border: 0; border-radius: 6px; color: #8b93a7; text-align: left">
      <svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"></path></svg>
      <span>New task</span>
    </button>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; height: 800px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 32px; overflow: hidden">
    <section style="display: flex; flex-direction: column; gap: 10px; max-width: 880px">
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8b93a7">For you</div>
      <button style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #0c0e14; border: 1px solid #1d2230; border-radius: 8px; color: #c9cfdd; text-align: left">
        <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #f0a443"></span>
        <span style="flex-grow: 1"><span style="color: #f6e7c8">A dream is ready to review.</span> Two proposals for the invoicing repo, from last night.</span>
        <span style="color: #f0a443">Review</span>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #0c0e14; border: 1px solid #1d2230; border-radius: 8px; color: #c9cfdd; text-align: left">
        <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #f0a443"></span>
        <span style="flex-grow: 1"><span style="color: #f6e7c8">Task 398 waits on you.</span> Its pull request has review comments.</span>
        <span style="color: #f0a443">Open</span>
      </button>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px; max-width: 880px">
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8b93a7">Places</div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: 104px; background: #0c0e14; border: 1px solid #1d2230; border-radius: 8px; color: #c9cfdd; text-align: left">
          <span style="font-size: 15px; font-weight: 500; color: #f6e7c8">Sprint</span>
          <span style="color: #8b93a7">Sprint 1. 6 items not started.</span>
        </button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: 104px; background: #0c0e14; border: 1px solid #1d2230; border-radius: 8px; color: #c9cfdd; text-align: left">
          <span style="font-size: 15px; font-weight: 500; color: #f6e7c8">Brain</span>
          <span style="color: #8b93a7">Shellie. 2 long reads waiting.</span>
        </button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: 104px; background: #0c0e14; border: 1px solid #1d2230; border-radius: 8px; color: #c9cfdd; text-align: left">
          <span style="font-size: 15px; font-weight: 500; color: #f6e7c8">Dreams</span>
          <span style="color: #8b93a7">1 to review. Next run tonight.</span>
        </button>
        <button style="display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: 104px; background: #0c0e14; border: 1px solid #1d2230; border-radius: 8px; color: #c9cfdd; text-align: left">
          <span style="font-size: 15px; font-weight: 500; color: #f6e7c8">Cost</span>
          <span style="color: #8b93a7; font-family: 'JetBrains Mono', monospace; font-size: 12px">€ 41.20 this month</span>
        </button>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px; max-width: 880px">
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8b93a7">Quieter things</div>
      <div style="display: flex; flex-wrap: wrap; gap: 20px; color: #8b93a7">
        <button style="padding: 0; background: transparent; border: 0; color: #8b93a7">Project</button>
        <button style="padding: 0; background: transparent; border: 0; color: #8b93a7">Settings</button>
        <button style="padding: 0; background: transparent; border: 0; color: #8b93a7">Done tasks</button>
        <button style="padding: 0; background: transparent; border: 0; color: #8b93a7">What is new</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
