# PR poller of the agentic SDLC (docs/superpowers/specs/2026-10-26-agentic-sdlc-design.md, docs/agents.md).
# Stage 2: reviews each new head commit of an agent PR, read-only. Runs on the owner's Claude subscription.
name: Agents · PR
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-pr
  cancel-in-progress: false

jobs:
  review:
    if: vars.AGENTS_MODE == 'implement' || vars.AGENTS_MODE == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install -g @anthropic-ai/claude-code@2.1.310
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
      - name: Review agent PRs
        env:
          AGENTS_MODE: ${{ vars.AGENTS_MODE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENTS_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node tools/agents/review.mjs
