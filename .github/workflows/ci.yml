name: CI
on:
  # main and v* tags only: a PR runs through pull_request, so a branch push no longer runs CI a second time
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # a branch without a PR: Actions › CI › Run workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the same on both systems, so once is enough
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The packaged app must load node-pty and spawn a pty (Windows does this in the installer jobs).
      # Unsigned here (MAC_SIGN is set only in macos-release); make also checks the DMG and zip makers.
      - name: Make and smoke-test (macOS)
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          npx electron-forge make --arch=arm64
          node tools/forge/smoke.mjs

  # The suite takes ~15 min on one Windows runner (real git and processes are slow there) against ~3 on macOS,
  # so Windows runs it in three parts at once.
  test-windows:
    name: test (windows-latest, part ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # One check named like the old Windows job, so required checks and the agents' merge rule keep working.
  test-windows-result:
    name: test (windows-latest)
    needs: test-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Windows parts passed
        run: test "${{ needs.test-windows.result }}" = success

  windows-installer:
    # Unsigned build for pull requests and non-release branches. Never signs.
    # Not waiting for the tests: it is an unsigned artifact only, and the release jobs below still need them.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # App telemetry (docs/telemetry.md): baked into the main bundle at build time; empty means none is sent.
      - run: npm run make
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      - name: Smoke-test the packaged app
        run: node tools/forge/smoke.mjs
      - name: Summary
        shell: pwsh
        run: '"Windows installer: **unsigned** (this is not main or a v* tag)" >> $env:GITHUB_STEP_SUMMARY'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Shellie-Setup-${{ github.sha }}
          path: out/make/squirrel.windows/**/Shellie-Setup.exe
          if-no-files-found: error

  # Whether main changed anything that goes into the app since the newest release (tools/release/needs-release.mjs):
  # a merge that only touches the agent pipeline, docs, art sources, tests or dev tools makes no new version.
  release-needed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to compare with the newest release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: check
        run: |
          app=$(node tools/release/needs-release.mjs)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ "$app" = true ]; then echo "App files changed since the last release: releasing." >> "$GITHUB_STEP_SUMMARY"
          else echo "Only non-app files (agents, docs, tests, tools) changed since the last release: **no new version**." >> "$GITHUB_STEP_SUMMARY"; fi

  windows-release:
    # Push to main with app changes, or a v* tag. Runs in the "release" environment, which holds the OIDC trust
    # for signing. Every push to main that changes the app (each such merged PR) publishes the next minor version,
    # so it can be tested through auto-update; a v* tag pushed by hand publishes exactly that version, always.
    if: >-
      always() && github.event_name == 'push' &&
      needs.test.result == 'success' && needs.test-windows.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && needs.release-needed.outputs.app == 'true'))
    needs: [test, test-windows, release-needed]
    # One release at a time, so two quick merges never pick the same version. A newer push replaces a
    # waiting one; its release then contains both.
    concurrency:
      group: windows-release
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
    # The release's tag, empty when this run made no release; macos-release adds its files to it.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AS_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      AS_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      AS_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Decide on signing
        shell: pwsh
        run: |
          $vars = [ordered]@{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            ARTIFACT_SIGNING_ENDPOINT = $env:AS_ENDPOINT
            ARTIFACT_SIGNING_ACCOUNT = $env:AS_ACCOUNT
            ARTIFACT_SIGNING_PROFILE = $env:AS_PROFILE
          }
          $missing = @($vars.Keys | Where-Object { -not $vars[$_] })
          if ($missing.Count -eq 0) {
            "SIGN=true" >> $env:GITHUB_ENV
            "Windows installer: **signed** with Azure Artifact Signing" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "SIGN=false" >> $env:GITHUB_ENV
            "Windows installer: **unsigned**. Missing variables: $($missing -join ', ')" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Azure login (OIDC)
        if: env.SIGN == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      - name: Prepare signing tools
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          nuget install Microsoft.ArtifactSigning.Client -OutputDirectory "$env:RUNNER_TEMP\as" -ExcludeVersion
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\as" -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object FullName -match 'x64' | Select-Object -First 1
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          $meta = "$env:RUNNER_TEMP\metadata.json"
          @{ Endpoint = $env:AS_ENDPOINT; CodeSigningAccountName = $env:AS_ACCOUNT; CertificateProfileName = $env:AS_PROFILE; ExcludeCredentials = @('ManagedIdentityCredential','EnvironmentCredential','WorkloadIdentityCredential','SharedTokenCacheCredential','VisualStudioCredential','VisualStudioCodeCredential','AzurePowerShellCredential','AzureDeveloperCliCredential','InteractiveBrowserCredential') } | ConvertTo-Json | Set-Content $meta
          "ARTIFACT_SIGNING_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_METADATA=$meta" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_ENDPOINT=$env:AS_ENDPOINT" >> $env:GITHUB_ENV
      - name: Version from tag
        # Squirrel and the update feed compare package.json versions, so a release build must carry its version.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag $env:TAG is not vX.Y.Z" }
          npm version $Matches[1] --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RELEASE_TAG=$env:TAG" >> $env:GITHUB_ENV
      - name: Next minor version (main)
        # The highest vX.Y.Z tag on the remote, minor + 1 and patch 0: v1.0.2 -> v1.1.0.
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = node tools/release/next-version.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "Release: **v$version**" >> $env:GITHUB_STEP_SUMMARY
      # App telemetry (docs/telemetry.md): baked into the main bundle at build time; empty means none is sent.
      - run: npm run make
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      - name: Smoke-test the packaged app
        run: node tools/forge/smoke.mjs
      - name: Verify signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          # electron-winstaller's nested windows-sign swallows hook errors, so verify every exe we produced.
          # That includes node-pty's OpenConsole.exe under app.asar.unpacked: the
          # packager's windows-sign walks the whole app folder and signs them with the rest.
          $exes = @(Get-ChildItem out -Recurse -Filter *.exe)
          if ($exes.Count -eq 0) { throw 'No exe files found under out/' }
          $failed = 0
          foreach ($exe in $exes) {
            & $env:SIGNTOOL_PATH verify /pa /v $exe.FullName
            if ($LASTEXITCODE) { "Signature check failed: $($exe.FullName)"; $failed++ }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Shellie-Setup-${{ github.sha }}
          path: out/make/squirrel.windows/**/Shellie-Setup.exe
          if-no-files-found: error
      - name: Release
        id: release
        # A normal release, signed or not: update.electronjs.org ignores drafts and prereleases.
        # It needs the installer (.exe), the RELEASES file and the .nupkg that RELEASES names.
        # On main, gh creates the tag at this commit (a tag made with the job token starts no new run).
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          $setup = Get-ChildItem out/make/squirrel.windows -Recurse -Filter Shellie-Setup.exe | Select-Object -First 1
          $dir = $setup.DirectoryName
          $releases = Join-Path $dir RELEASES
          if (-not (Test-Path $releases)) { throw "No RELEASES file next to $($setup.FullName)" }
          $nupkgs = @(Get-ChildItem $dir -Filter *.nupkg)
          if ($nupkgs.Count -eq 0) { throw "No .nupkg next to $($setup.FullName)" }
          foreach ($line in Get-Content $releases) {
            $name = ($line -split '\s+')[1]
            if ($name -and -not (Test-Path (Join-Path $dir $name))) { throw "RELEASES names $name, which was not built" }
          }
          $assets = @($setup.FullName, $releases) + @($nupkgs | ForEach-Object FullName)
          $title = if ($env:SIGN -eq 'true') { "Shellie $env:TAG" } else { "Shellie $env:TAG (unsigned)" }
          gh release create $env:TAG @assets --title $title --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "tag=$env:TAG" >> $env:GITHUB_OUTPUT

  macos-release:
    # Adds the signed, notarized Apple Silicon build to the release windows-release just made. It runs
    # after that release and only reads its tag, so a failure here never blocks or changes the Windows
    # release. Without all Apple secrets the build is unsigned and stays a run artifact only.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.windows-release.outputs.tag != ''
    needs: windows-release
    concurrency:
      group: macos-release
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.windows-release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version from the release tag
        # The update feed compares package.json versions, so the build carries the release's version.
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag $TAG is not vX.Y.Z"; exit 1; fi
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - name: Decide on signing
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "MAC_SIGN=true" >> "$GITHUB_ENV"
            echo "macOS build: **signed and notarized**, added to $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS build: **unsigned**, run artifact only (not added to $TAG). Missing: $(printf '%s, ' "${missing[@]}" | sed 's/, $//')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare the signing keychain
        if: env.MAC_SIGN == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/shellie-signing.keychain-db"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # osx-sign finds the Developer ID identity through the user search list.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%\"}"; line="${line#\"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # App telemetry (docs/telemetry.md): baked into the main bundle at build time; empty means none is sent.
      # Signs and notarizes only when MAC_SIGN=true (tools/forge/macSigning.mjs).
      - name: Make (Apple Silicon)
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-forge make --arch=arm64
      - name: Smoke-test the packaged app
        run: node tools/forge/smoke.mjs
      - name: Verify signature and notarization
        if: env.MAC_SIGN == 'true'
        run: |
          set -euo pipefail
          app=out/Shellie-darwin-arm64/Shellie.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute -v "$app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Shellie-mac-${{ github.sha }}
          path: |
            out/make/dmg/arm64/*.dmg
            out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error
      - name: Add to the release
        # Only a signed build goes to the release. --clobber lets "Re-run failed jobs" replace the files.
        # The zip keeps Forge's name: update.electronjs.org finds the darwin-arm64 update by it.
        if: env.MAC_SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dmg="out/make/dmg/arm64/Shellie-$version-arm64.dmg"
          zip="out/make/zip/darwin/arm64/Shellie-darwin-arm64-$version.zip"
          test -f "$dmg" || { echo "No DMG at $dmg"; exit 1; }
          test -f "$zip" || { echo "No zip at $zip"; exit 1; }
          cp "$dmg" "$RUNNER_TEMP/Shellie.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/Shellie.dmg" "$zip" --clobber
      - name: Remove the signing keychain and keys
        if: always()
        run: |
          keychain="$RUNNER_TEMP/shellie-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain" || true; fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Shellie.dmg"
