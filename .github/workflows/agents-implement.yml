# Implement poller of the agentic SDLC (docs/superpowers/specs/2026-10-26-agentic-sdlc-design.md, docs/agents.md).
# Three jobs so the agent, which runs code, never shares a machine with the GitHub App token:
#   pick (App token) -> implement (Claude subscription token only) -> publish (App token, a fresh machine).
# Runs on the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN). Never add an ANTHROPIC_API_KEY.
name: Agents · implement
on:
  # the polls are a safety net; it also starts when triage finished (maybe a new agent:ready issue) and when a
  # PR closed (merged or not: the one agent PR slot may be free). Not on the PR poller finishing: the PR
  # poller starts on CI, which the implementer's PR starts, and the two must not start each other in a loop.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Agents · triage']
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

# The jobs' own files (task, result, bundle) live in $RUNNER_TEMP/agents (AGENTS_WORK), outside the checkout,
# so they are never linted, tested or committed.

concurrency:
  group: agents-implement
  cancel-in-progress: false

jobs:
  pick:
    if: vars.AGENTS_MODE == 'implement' || vars.AGENTS_MODE == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }} # never a PR's code, whatever the event
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
      # the owner's project token, for the order of the Ready cards on the board (optional; not needed to pick)
      - name: Hand the project token to the script in a file
        env:
          TOKEN: ${{ secrets.AGENTS_PROJECT_TOKEN }}
        run: if [ -n "$TOKEN" ]; then umask 077 && printf '%s' "$TOKEN" > "$RUNNER_TEMP/agents-project-token"; fi
      - id: pick
        name: Pick an issue
        env:
          AGENTS_MODE: ${{ vars.AGENTS_MODE }}
          AGENTS_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AGENTS_PROJECT_TOKEN_FILE: ${{ runner.temp }}/agents-project-token
          AGENTS_WORK: ${{ runner.temp }}/agents
        run: node tools/agents/implement.mjs pick
      - if: steps.pick.outputs.issue != ''
        uses: actions/upload-artifact@v4
        with:
          name: task
          path: ${{ runner.temp }}/agents/task.json
          retention-days: 7

  implement:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }} # never a PR's code, whatever the event
          fetch-depth: 0
          persist-credentials: false # no GitHub token on this machine
      # no npm cache here: untrusted code runs on this machine, and it must not write a cache other jobs restore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code@2.1.310
      - uses: actions/download-artifact@v4
        with:
          name: task
          path: ${{ runner.temp }}/agents
      - name: Implement
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENTS_WORK: ${{ runner.temp }}/agents
        run: node tools/agents/implement.mjs run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            ${{ runner.temp }}/agents/result.json
            ${{ runner.temp }}/agents/branch.bundle
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [pick, implement]
    # also after a failed or cancelled implement job: publish releases the lock
    if: always() && needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write to start the next implementation after a PR (up to maxOpenAgentPrs at once)
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }} # never a PR's code, whatever the event
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: task
          path: ${{ runner.temp }}/agents
      - uses: actions/download-artifact@v4
        continue-on-error: true # missing when the implement job died
        with:
          name: result
          path: ${{ runner.temp }}/agents/result
      - id: publish
        name: Check and publish
        env:
          AGENTS_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AGENTS_WORK: ${{ runner.temp }}/agents
        run: node tools/agents/implement.mjs publish
      # a PR is open: start the next implementation now instead of waiting for a poll; a run that picks
      # nothing opens no PR and starts nothing, so this cannot loop
      - name: Start the next implementation
        if: steps.publish.outputs.opened != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agents-implement.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
