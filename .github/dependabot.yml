# Dependency updates (#193). The PR poller (tools/agents/pr.mjs, docs/agents.md) merges a Dependabot PR by itself
# when it is a patch or minor update and CI is green; majors and GitHub Actions bumps wait for the owner's Approve.
# Security updates come as soon as an advisory is out (Settings › Code security), version updates weekly, and only
# for releases at least 7 days old (14 for an npm major).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Brussels
    # minor and patch updates in one PR; each major update has its own
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # supply chain: a release is offered only after it has been out a while, so a hijacked version is usually
    # caught and pulled first. Security updates skip this wait.
    cooldown:
      default-days: 7
      semver-major-days: 14
    labels: [dependencies]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Brussels
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # the same wait; Actions tags are not always semver, so one number for all
    cooldown:
      default-days: 7
    labels: [dependencies]
    open-pull-requests-limit: 5
